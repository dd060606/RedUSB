[workspace]
resolver = "2"
members = ["core", "firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["dd060606"]

[profile.dev]
opt-level = 1
debug = 2
lto = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 2
lto = "fat"
codegen-units = 1
incremental = false

# Do not optimise proc-macros, it slows down builds for no gain.
[profile.dev.build-override]
opt-level = 0
[profile.release.build-override]
opt-level = 0
