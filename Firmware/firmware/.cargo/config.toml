[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flash over USB: put the board in BOOTSEL mode, then `cargo run --release`.
runner = "elf2uf2-rs -d"

linker = "flip-link"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "no-vectorize-loops",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "info"
